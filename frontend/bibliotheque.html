<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotheque</title>
    <link rel="stylesheet" href="bibliotheque.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <h1 id="page_name">LIBRARY</h1>
        <img id="bookshelf" src="./img/bookshelf.png" alt="bookshelf">
    </header>
    

    <div id="main_container"></div>

    <div id="displayed_story" class="hidden">
        <div id="story_container" class="">
            <p id="story"></p>
            <button class="hidden" id="close">Finish reading</button>
        </div>
    </div>
        
    <div id="footer_container"></div>

    <script src="bibliotheque.js"></script>
</body>
</html>
