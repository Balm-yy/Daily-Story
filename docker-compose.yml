services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - postgres
    environment:
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_HOST=postgres
      - PG_DATABASE=${PG_DATABASE}
      - PG_PORT=${PG_PORT}

  postgres:
    image: postgres:16
    container_name: daily_stories-postgres-1
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - daily_stories_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  daily_stories_pgdata:
